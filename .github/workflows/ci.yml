name: CI

on:
  pull_request:
    branches: [master, deploy-test, frontend-prototipiranje, skripte]
  push:
    branches: [master, deploy-test, frontend-prototipiranje, skripte]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.3"
      - name: Wasp
        run: bash ../scripts/okruzenje.sh
      - name: Server
        run: |
          wasp build
          cd .wasp/out/server
          npm install
          npx prisma generate --schema=../db/schema.prisma
          npm run bundle
      - name: Klijent
        env:
          REACT_APP_API_URL: http://localhost:3001
        run: |
          npx vite build